<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f1e35" />
    </radialGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="tealGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)" />

  <g fill="#eaf4f4" opacity="0.92" filter="url(#tileShadow)">
    <rect x="118" y="118" width="140" height="140" rx="28" />
    <rect x="280" y="118" width="140" height="140" rx="28" />
    <rect x="442" y="118" width="140" height="140" rx="28" />
    <rect x="604" y="118" width="140" height="140" rx="28" />
    <rect x="766" y="118" width="140" height="140" rx="28" />

    <rect x="118" y="280" width="140" height="140" rx="28" />
    <rect x="280" y="280" width="140" height="140" rx="28" />
    <rect x="442" y="280" width="140" height="140" rx="28" />
    <rect x="604" y="280" width="140" height="140" rx="28" />
    <rect x="766" y="280" width="140" height="140" rx="28" />

    <rect x="118" y="442" width="140" height="140" rx="28" />
    <rect x="280" y="442" width="140" height="140" rx="28" />
    <rect x="604" y="442" width="140" height="140" rx="28" />
    <rect x="766" y="442" width="140" height="140" rx="28" />

    <rect x="118" y="604" width="140" height="140" rx="28" />
    <rect x="280" y="604" width="140" height="140" rx="28" />
    <rect x="442" y="604" width="140" height="140" rx="28" />
    <rect x="604" y="604" width="140" height="140" rx="28" />
    <rect x="766" y="604" width="140" height="140" rx="28" />

    <rect x="118" y="766" width="140" height="140" rx="28" />
    <rect x="280" y="766" width="140" height="140" rx="28" />
    <rect x="442" y="766" width="140" height="140" rx="28" />
    <rect x="604" y="766" width="140" height="140" rx="28" />
    <rect x="766" y="766" width="140" height="140" rx="28" />
  </g>

  <rect x="442" y="442" width="140" height="140" rx="28" fill="#00b4a6" filter="url(#tileShadow)" />
  <rect x="442" y="442" width="140" height="140" rx="28" fill="#00b4a6" opacity="0.35" filter="url(#tealGlow)" />
</svg>
