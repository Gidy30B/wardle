<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E1E2C" />
    <title>Wardle is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #1e1e2c;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(38, 166, 154, 0.18), transparent 32rem),
          #1e1e2c;
      }

      main {
        width: min(100%, 28rem);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: clamp(1.8rem, 8vw, 2.5rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: rgba(248, 250, 252, 0.72);
        line-height: 1.55;
      }

      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #26a69a;
        color: #121822;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 12px 18px;
      }

      button:focus-visible {
        outline: 3px solid rgba(248, 250, 252, 0.85);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/wardle-icon.png" alt="" />
      <h1>Wardle is offline</h1>
      <p>
        Reconnect to load today's case. Cases that have not already been stored
        on this device are unavailable offline.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
